<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Road Detector</title>
</head>
<body>
    <h1>Road Detector</h1>

        <img src="/static/result.jpg" width="500">

    </form>

</body>
</html>
